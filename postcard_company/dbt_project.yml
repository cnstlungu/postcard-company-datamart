name: 'postcard_company'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'postcard_company'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
#packages-install-path: /dbt_packages

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# The calendar dim_date materialises. Every generated sale has to fall inside
# it, or fact_sales ends up with bought_date_key values that join to no row in
# dim_date. generator/generate.py mirrors these and refuses to generate outside
# them; CI checks that the two agree.
vars:
  calendar_start: '2010-01-01'
  calendar_end: '2035-12-31'

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  +start: Jan 1 2000
  postcard_company:
    # Config indicated by + and applies to all files under models/example/
    +materialized: table

seeds:
  postcard_company:
    +enabled: true
    +schema: raw
    geography:
      id: int
      cityname: varchar(32)
      countryname: varchar(32)
      regionname: varchar(32)