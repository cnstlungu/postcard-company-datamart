models:
- name: dim_channel
  config:
    contract:
      enforced: true
  columns:
  - name: channel_key
    data_type: INTEGER
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
  - name: channel_name
    data_type: VARCHAR
    tests:
    - unique
    - not_null
    - accepted_values:
        values:
        - in-store
        - web
        - mobile app
  - name: original_channel_id
    data_type: INTEGER
  description: Sales channels a postcard can be bought through. Small static dimension; channel_key is
    carried straight through from the source id.
- name: fact_sales
  config:
    contract:
      enforced: true
  columns:
  - name: sales_key
    data_type: VARCHAR
    tests:
    - unique
    - not_null
    description: Surrogate key over (sales_agent_key, transaction_id). Unique because transaction_id is
      globally unique across sources.
  - name: channel_key
    data_type: INTEGER
    tests:
    - not_null
  - name: bought_date_key
    data_type: INTEGER
    tests:
    - not_null
    - relationships:
        to: ref('dim_date')
        field: date_key
    description: Integer date of the sale in YYYYMMDD form. Tested against dim_date so that a sale generated
      outside the calendar fails the build instead of quietly dropping out of every date-based report.
  - name: commissionpaid
    data_type: DOUBLE
    description: Commission value on this sale. Null for direct sales.
  - name: commissionpct
    data_type: DOUBLE
    description: Commission rate for the selling agent. Null for direct sales, which pay no commission.
  - name: customer_key
    data_type: VARCHAR
    tests:
    - not_null
  - name: geography_key
    data_type: INTEGER
    tests:
    - not_null
  - name: product_key
    data_type: VARCHAR
    tests:
    - not_null
  - name: product_price
    data_type: DOUBLE
  - name: qty
    data_type: INTEGER
    tests:
    - not_null
  - name: total_amount
    data_type: DOUBLE
    tests:
    - not_null
    description: 'Gross line value: quantity multiplied by the product price at time of sale.'
  - name: transaction_id
    data_type: BIGINT
    description: Transaction identifier from the source system. Unique across all three feeds.
  - name: sales_agent_key
    data_type: INTEGER
  description: One row per sale, unioned from direct sales and both reseller feeds. Grain is one transaction
    per sales agent, so sales_key is the surrogate key over (sales_agent_key, transaction_id).
- name: dim_sales_agent
  config:
    contract:
      enforced: true
    constraints:
    - type: primary_key
      columns:
      - sales_agent_key
  columns:
  - name: sales_agent_key
    data_type: INTEGER
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
  - name: reseller_name
    data_type: VARCHAR
  - name: original_reseller_id
    data_type: INTEGER
  - name: commission_pct
    data_type: DOUBLE
    description: Commission rate applied to this agent's sales.
  description: Resellers selling on the company's behalf, plus a synthetic agent representing direct sales.
    Carries the commission rate applied to reseller transactions.
- name: dim_customer
  config:
    contract:
      enforced: true
  columns:
  - name: customer_key
    data_type: VARCHAR
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
    description: Surrogate key. Derived from (0, customer_id) for direct customers and (reseller_id, email)
      for reseller customers.
  - name: original_customer_id
    data_type: BIGINT
  - name: customer_first_name
    data_type: VARCHAR
  - name: customer_last_name
    data_type: VARCHAR
  - name: customer_email
    data_type: VARCHAR
    tests:
    - not_null
  - name: customer_phone
    data_type: VARCHAR
  - name: customer_address
    data_type: VARCHAR
  - name: customer_city
    data_type: VARCHAR
  - name: customer_country
    data_type: VARCHAR
  - name: customer_postal_code
    data_type: VARCHAR
  - name: sales_agent_key
    data_type: INTEGER
  description: Customers unified across all three sources. Direct customers key off their source customer_id;
    reseller customers have no stable identifier, so they key off (reseller_id, email).
- name: dim_geography
  config:
    contract:
      enforced: true
  columns:
  - name: geography_key
    data_type: INTEGER
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
  - name: country_name
    data_type: VARCHAR
  - name: city_name
    data_type: VARCHAR
  - name: region_name
    data_type: VARCHAR
  description: Cities the postcards depict, with country and region. Loaded from the geography seed rather
    than the generated data.
- name: dim_product
  config:
    contract:
      enforced: true
  columns:
  - name: product_key
    data_type: VARCHAR
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
  - name: product_name
    data_type: VARCHAR
  - name: geography_key
    data_type: INTEGER
  - name: original_product_id
    data_type: VARCHAR
  - name: product_price
    data_type: DOUBLE
    tests:
    - dbt_utils.expression_is_true:
        expression: '> 0'
    description: List price. Asserted to be strictly positive.
  description: 'The postcard catalogue: one row per product, with its depicted city and list price.'
- name: dim_date
  config:
    contract:
      enforced: true
  columns:
  - name: date_key
    data_type: INTEGER
    constraints:
    - type: primary_key
    tests:
    - unique
    - not_null
    description: Integer date in YYYYMMDD form, used as the foreign key from fact_sales.
  - name: date_value
    data_type: DATE
    tests:
    - unique
    - not_null
  - name: day_of_year
    data_type: BIGINT
  - name: week_key
    data_type: BIGINT
  - name: week_of_year
    data_type: BIGINT
  - name: day_of_week
    data_type: BIGINT
  - name: iso_day_of_week
    data_type: BIGINT
  - name: day_name
    data_type: VARCHAR
  - name: first_day_of_week
    data_type: DATE
  - name: last_day_of_week
    data_type: DATE
  - name: month_key
    data_type: VARCHAR
  - name: month_of_year
    data_type: BIGINT
  - name: day_of_month
    data_type: BIGINT
  - name: month_name_short
    data_type: VARCHAR
  - name: month_name
    data_type: VARCHAR
  - name: first_day_of_month
    data_type: DATE
  - name: last_day_of_month
    data_type: DATE
  - name: quarter_key
    data_type: INTEGER
  - name: quarter_of_year
    data_type: BIGINT
  - name: day_of_quarter
    data_type: INTEGER
  - name: quarter_desc_short
    data_type: VARCHAR
  - name: quarter_desc
    data_type: VARCHAR
  - name: first_day_of_quarter
    data_type: DATE
  - name: last_day_of_quarter
    data_type: DATE
  - name: year_key
    data_type: INTEGER
  - name: first_day_of_year
    data_type: DATE
  - name: last_day_of_year
    data_type: DATE
  - name: ordinal_weekday_of_month
    data_type: BIGINT
  description: Date spine generated rather than sourced, so every bought_date resolves to a row. Its range
    comes from the calendar_start / calendar_end vars in dbt_project.yml; the generator mirrors them and
    refuses to produce sales outside them.
- name: raw_channels
  description: Passthrough of the channels extract, with a load timestamp. No business logic.
- name: raw_customers
  description: Passthrough of the direct-customer extract, with a load timestamp.
- name: raw_products
  description: Passthrough of the product catalogue extract, with a load timestamp.
- name: raw_resellers
  description: Passthrough of the reseller reference extract, with a load timestamp.
- name: raw_transactions
  description: Passthrough of the direct-sales transaction extract, with a load timestamp.
- name: raw_reseller_type1_sales
  description: Passthrough of the type 1 reseller feed, which arrives with human-readable spaced column
    names. Renaming happens in staging.
- name: raw_reseller_type2_sales
  description: Passthrough of the type 2 reseller feed, which arrives camelCased with the customer nested
    in a struct. Flattening happens here; renaming happens in staging.
- name: staging_channels
  description: Channels typed and given their surrogate key.
  columns:
  - name: channel_key
    description: Surrogate key for the channel.
    tests:
    - unique
    - not_null
- name: staging_customers
  description: Direct and reseller customers combined and deduplicated into one customer list.
  columns:
  - name: customer_key
    description: Surrogate key for the customer.
    tests:
    - not_null
- name: staging_products
  description: Product catalogue joined to geography, deduplicated to the latest row per product_id.
  columns:
  - name: product_key
    description: Surrogate key for the product.
    tests:
    - unique
    - not_null
- name: staging_resellers
  description: Resellers deduplicated to the latest row per reseller_id.
  columns:
  - name: reseller_id
    description: Source reseller identifier.
    tests:
    - unique
    - not_null
- name: staging_transactions_main
  description: Direct sales, loaded incrementally on loaded_timestamp.
  columns:
  - name: transaction_id
    description: Source transaction identifier, globally unique across feeds.
    tests:
    - unique
    - not_null
- name: staging_reseller_type1_sales
  description: Type 1 reseller sales, renamed and typed. Incremental on the (reseller_id, transaction_id)
    grain.
  columns:
  - name: transaction_id
    description: Transaction identifier, unique only within a reseller.
    tests:
    - not_null
  - name: reseller_id
    description: Reseller this sale belongs to.
    tests:
    - not_null
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - reseller_id
      - transaction_id
- name: staging_reseller_type2_sales
  description: Type 2 reseller sales, renamed and typed. Incremental on the (reseller_id, transaction_id)
    grain.
  columns:
  - name: transaction_id
    description: Transaction identifier, unique only within a reseller.
    tests:
    - not_null
  - name: reseller_id
    description: Reseller this sale belongs to.
    tests:
    - not_null
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - reseller_id
      - transaction_id
- name: staging_transactions
  description: All sales from the three feeds unioned into one shape, ready for the fact table.
  columns:
  - name: transaction_id
    description: Source transaction identifier. Unique across the union; this guards the id collision
      that used to exist between reseller feeds.
    tests:
    - unique
    - not_null
