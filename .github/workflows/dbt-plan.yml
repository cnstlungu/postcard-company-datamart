name: dbt schema review

on:
  pull_request:
    paths:
      - "postcard_company/**"
      - "requirements-ci.txt"
      - ".github/workflows/dbt-plan.yml"

permissions:
  contents: read

concurrency:
  group: dbt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schema-review:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/postcard_company
      DUCKDB_FILE_PATH: ":memory:"
      INPUT_FILES_PATH: ${{ github.workspace }}/shared/parquet
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements-ci.txt
      # Compilation resolves the project SQL without reading the parquet inputs.
      # Install dbt packages separately for each revision before compiling it.
      - name: Report column changes and downstream risks
        uses: PresentJay/dbt-plan@d98f06e8674a1e68a009112b90d0d00c41416c33 # v0.18.5
        with:
          version: "0.18.5"
          project-dir: postcard_company
          compile-command: dbt deps && dbt compile --no-partial-parse
          fail-on: never
